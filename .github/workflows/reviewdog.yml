name: reviewdog
on: [pull_request]
jobs:
  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1.34.1
        with:
          github_token: ${{ secrets.github_token }}
  misspell:
    name: runner / misspell
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@v7.0.1
      - name: misspell
        uses: reviewdog/action-misspell@v1.30.4
        with:
          github_token: ${{ secrets.github_token }}
          locale: "US"
